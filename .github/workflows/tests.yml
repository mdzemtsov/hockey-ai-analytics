name: Core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s hockey_ai_analytics/v6/tests -p 'test_*.py' -v
      - run: node --check hockey_ai_analytics/v6/web/app.js
      - run: node --check hockey_ai_analytics/v6/web/coach.js
